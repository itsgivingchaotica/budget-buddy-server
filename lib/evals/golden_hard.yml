# the first hard-set run. All merchants and people are fictional (well-known
# chains appear only as merchants).
#
# Labels are the author's judgement (Claude Code, 2026-11-26), reviewable by
# the product owner. Rows marked `ambiguous` have a defensible label but a
# reasonable person could pick another.
